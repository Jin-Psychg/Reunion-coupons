<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>见面兑换券</title><style>:root{--ink:#563f2d;--red:#c75b48;--cream:#fff8df}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;background:#efd690;background-image:radial-gradient(#d9bb70 1px,transparent 1px);background-size:13px 13px}.wrap{max-width:480px;margin:auto;min-height:100vh;padding:18px 18px 50px}.hero{background:var(--cream);border:2px solid #795f42;border-radius:24px;overflow:hidden;box-shadow:0 7px 0 #b58e55}.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.heroText{text-align:center;padding:16px 14px 20px}.hero h1{font-family:Georgia,serif;font-style:italic;font-size:31px;margin:0 0 5px}.hero p{margin:0;opacity:.75}.book{display:grid;gap:16px;margin-top:22px}.coupon{background:var(--cream);border:2px dashed #8b6948;border-radius:18px;padding:18px;position:relative;box-shadow:0 5px 0 #c6a66a;overflow:hidden}.tag{font:700 11px/1 system-ui;letter-spacing:.16em;color:var(--red)}.coupon h2{font-family:Georgia,"Songti SC",serif;font-size:24px;margin:7px 0}.coupon p{font-size:15px;margin:0 0 15px}.redeem,.swap{border:1.5px solid #76583d;border-radius:999px;background:#f4d98e;color:#493523;padding:9px 15px;font-weight:700}.swap{display:none;margin-top:10px;background:#fff4cf;font-size:12px}.redeemed .redeem{display:none}.redeemed .swap{display:inline-block}.stamp{display:none;position:absolute;right:16px;bottom:16px;border:3px solid var(--red);color:var(--red);font:900 16px Georgia;padding:6px 9px;transform:rotate(-9deg);border-radius:5px}.redeemed .stamp{display:block}.wish input{width:100%;border:0;border-bottom:1.5px solid #84664a;background:transparent;padding:8px 2px;margin:0 0 14px;font:16px inherit}.music{position:fixed;right:17px;top:17px;z-index:20;width:43px;height:43px;border-radius:50%;border:1.5px solid #6f573e;background:#fff4cd;font-size:20px;display:none}.note{text-align:center;font-size:12px;opacity:.6;margin-top:24px}dialog{border:2px solid #73583d;border-radius:18px;background:#fff8df;color:var(--ink);max-width:330px;width:calc(100% - 40px);padding:22px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}.actions button{border:1px solid #76583d;border-radius:999px;padding:8px 13px;background:#fff4cf}.actions .yes{background:#e8c66d;font-weight:700}.gate{position:fixed;inset:0;z-index:50;background:#efd690;background-image:radial-gradient(#d9bb70 1px,transparent 1px);background-size:13px 13px;display:flex;align-items:center;justify-content:center;padding:24px}.gateCard{width:min(420px,100%);background:var(--cream);border:2px solid #795f42;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 #b58e55;text-align:center}.gateCard img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.gateInner{padding:20px 18px 24px}.gateTitle{font-family:Georgia,"Songti SC",serif;font-size:30px;font-style:italic;margin:0 0 8px}.gateText{margin:0 0 18px;opacity:.72}.openBtn{border:1.5px solid #76583d;border-radius:999px;background:#e8c66d;color:#493523;padding:11px 20px;font-weight:800;font-size:15px}.gate.hide{animation:fade .35s ease forwards;pointer-events:none}@keyframes fade{to{opacity:0;visibility:hidden}}</style></head><body><div class="gate" id="gate"><div class="gateCard"><img src="our-illustration.jpeg" alt="我们的插画"><div class="gateInner"><h1 class="gateTitle">见面兑换券</h1><p class="gateText">留到见面的时候用。</p><button class="openBtn" id="openBtn">打开兑换券</button></div></div></div><audio id="bgm" src="天下第一好.m4a" preload="auto" loop playsinline></audio><button class="music" id="music" aria-label="暂停或继续音乐">Ⅱ</button><div class="wrap"><section class="hero"><img src="our-illustration.jpeg" alt="我们的插画"><div class="heroText"><h1>见面兑换券</h1><p>留到见面的时候用。</p></div></section><main class="book" id="book"></main><div class="note">兑换后如果选错了，可以单独换一张</div></div><dialog id="confirm"><b>现在兑换这张券？</b><div class="actions"><button id="later">先留着</button><button class="yes" id="yes">兑换</button></div></dialog><dialog id="swapConfirm"><b>换一张？</b><p>这张券会恢复成未兑换状态。</p><div class="actions"><button id="keep">不换了</button><button class="yes" id="swapYes">换一张</button></div></dialog><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getDatabase,ref,push,set,onValue,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";const cfg={apiKey:"AIzaSyBs9kQ_OhAIvrT7_zmDvEap9JMtGwq7nYY",authDomain:"reunion-coupons.firebaseapp.com",databaseURL:"https://reunion-coupons-default-rtdb.firebaseio.com",projectId:"reunion-coupons",storageBucket:"reunion-coupons.firebasestorage.app",messagingSenderId:"103744450895",appId:"1:103744450895:web:d48f9139ae6d7bb1c6953a"};const db=getDatabase(initializeApp(cfg));const coupons=[['♨️','Spa Day','一起去放松一天'],['🍜','美食任选券','这一次，你想吃什么，我们就去吃什么'],['🎬','电影券','你选电影，我陪你看'],['💆','按摩券','兑换一次按摩'],['🛒','清空购物车券','选好想买的，我来买单'],['✨','愿望券','写一个你想和我一起做的事']];function clearLocal(){for(let i=0;i<coupons.length;i++)localStorage.removeItem('coupon'+i);localStorage.removeItem('wish')}const book=document.querySelector('#book'),confirmBox=document.querySelector('#confirm'),swapConfirm=document.querySelector('#swapConfirm');let pending=null,pendingSwap=null;function render(){book.innerHTML='';coupons.forEach((c,i)=>{const redeemed=!!localStorage['coupon'+i];let el=document.createElement('section');el.className='coupon '+(i===5?'wish ':'')+(redeemed?'redeemed':'');el.innerHTML=`<div class="tag">COUPON ${String(i+1).padStart(2,'0')}</div><h2>${c[0]} ${c[1]}</h2><p>${c[2]}</p>${i===5?`<input placeholder="我想……" value="${localStorage.wish||''}" ${redeemed?'disabled':''}>`:''}<button class="redeem">兑换</button><button class="swap">换一张</button><div class="stamp">REDEEMED</div>`;el.querySelector('.redeem').onclick=()=>{if(i===5){const w=el.querySelector('input').value.trim();if(!w){el.querySelector('input').focus();return}localStorage.wish=w}pending={i,el};confirmBox.showModal()};el.querySelector('.swap').onclick=()=>{pendingSwap={i,el};swapConfirm.showModal()};book.appendChild(el)})}render();document.querySelector('#later').onclick=()=>confirmBox.close();document.querySelector('#yes').onclick=async()=>{if(!pending)return;const{i,el}=pending,wish=i===5?(el.querySelector('input')?.value.trim()||''):'';const when=Date.now();try{await set(push(ref(db,'redemptions')),{type:'redeem',couponIndex:i,couponName:coupons[i][1],wish,redeemedAt:serverTimestamp(),clientTime:when});localStorage['coupon'+i]=when;el.classList.add('redeemed');el.querySelector('input')?.setAttribute('disabled','')}catch(e){alert('兑换记录暂时没有保存成功，请再试一次。')}confirmBox.close();pending=null};document.querySelector('#keep').onclick=()=>swapConfirm.close();document.querySelector('#swapYes').onclick=async()=>{if(!pendingSwap)return;const{i}=pendingSwap,when=Date.now();try{await set(push(ref(db,'redemptions')),{type:'cancel',couponIndex:i,couponName:coupons[i][1],redeemedAt:serverTimestamp(),clientTime:when});localStorage.removeItem('coupon'+i);if(i===5)localStorage.removeItem('wish');render()}catch(e){alert('暂时没能撤销，请再试一次。')}swapConfirm.close();pendingSwap=null};let firstReset=true;onValue(ref(db,'resetVersion'),s=>{const remote=Number(s.val()||0),local=Number(localStorage.getItem('resetVersion')||0);if(firstReset){firstReset=false;if(remote>local){clearLocal();localStorage.setItem('resetVersion',String(remote));render()}return}if(remote>local){clearLocal();localStorage.setItem('resetVersion',String(remote));render()}});const bgm=document.querySelector('#bgm'),musicBtn=document.querySelector('#music'),gate=document.querySelector('#gate'),openBtn=document.querySelector('#openBtn');openBtn.onclick=async()=>{try{await bgm.play();musicBtn.textContent='Ⅱ'}catch(e){musicBtn.textContent='♪'}musicBtn.style.display='block';gate.classList.add('hide')};musicBtn.onclick=async()=>{if(bgm.paused){try{await bgm.play();musicBtn.textContent='Ⅱ'}catch(e){musicBtn.textContent='♪'}}else{bgm.pause();musicBtn.textContent='♪'}};bgm.addEventListener('play',()=>musicBtn.textContent='Ⅱ');bgm.addEventListener('pause',()=>musicBtn.textContent='♪');</script></body></html>
