<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兑换记录</title><style>body{margin:0;background:#efd690;color:#563f2d;font-family:system-ui,"PingFang SC",sans-serif}.wrap{max-width:620px;margin:auto;padding:28px 18px}h1{font-family:Georgia,"Songti SC",serif}.panel,.card{background:#fff8df;border:1.5px solid #806447;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 0 #c6a66a}.name{font-weight:800;font-size:18px}.time,.meta{opacity:.65;font-size:13px;margin-top:5px}.wish{margin-top:10px;padding-top:10px;border-top:1px dashed #b79a6f}.empty{opacity:.65}.btn{border:1px solid #76583d;border-radius:999px;background:#f4d98e;color:#493523;padding:10px 15px;font-weight:700}.small{font-size:12px;word-break:break-all;margin-top:12px}.hidden{display:none}</style></head><body><div class="wrap"><h1>兑换记录</h1><div class="panel" id="loginPanel"><p>登录后查看兑换记录。</p><button class="btn" id="login">使用 Google 登录</button><div id="err" class="meta"></div></div><div class="panel hidden" id="userPanel"><b>已登录</b><div id="email" class="meta"></div><div class="small">UID：<span id="uid"></span></div><p style="font-size:12px;opacity:.65">把上面的 UID 发给我，用来设置只有你的账号可以读取后台。</p><button class="btn" id="logout">退出登录</button></div><div id="list" class="empty hidden">正在读取……</div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";const firebaseConfig={apiKey:"AIzaSyBs9kQ_OhAIvrT7_zmDvEap9JMtGwq7nYY",authDomain:"reunion-coupons.firebaseapp.com",databaseURL:"https://reunion-coupons-default-rtdb.firebaseio.com",projectId:"reunion-coupons",storageBucket:"reunion-coupons.firebasestorage.app",messagingSenderId:"103744450895",appId:"1:103744450895:web:d48f9139ae6d7bb1c6953a"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider(),loginPanel=document.querySelector('#loginPanel'),userPanel=document.querySelector('#userPanel'),list=document.querySelector('#list'),err=document.querySelector('#err');let unsub=null;document.querySelector('#login').onclick=async()=>{err.textContent='';try{await signInWithPopup(auth,provider)}catch(e){err.textContent='登录失败：'+e.message}};document.querySelector('#logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}if(!u){loginPanel.classList.remove('hidden');userPanel.classList.add('hidden');list.classList.add('hidden');return}loginPanel.classList.add('hidden');userPanel.classList.remove('hidden');list.classList.remove('hidden');document.querySelector('#email').textContent=u.email||'';document.querySelector('#uid').textContent=u.uid;list.textContent='正在读取……';unsub=onValue(ref(db,'redemptions'),s=>{const d=s.val();if(!d){list.className='empty';list.textContent='还没有兑换记录。';return}const a=Object.values(d).sort((x,y)=>(y.redeemedAt||y.clientTime||0)-(x.redeemedAt||x.clientTime||0));list.className='';list.innerHTML=a.map(x=>`<div class="card"><div class="name">${esc(x.couponName||'兑换券')}</div><div class="time">${new Date(x.redeemedAt||x.clientTime).toLocaleString('zh-CN')}</div>${x.wish?`<div class="wish">愿望：${esc(x.wish)}</div>`:''}</div>`).join('')},e=>{list.className='empty';list.textContent='暂时没有读取权限。UID 已显示在上方，请先完成数据库权限设置。'})});function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
