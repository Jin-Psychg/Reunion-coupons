<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兑换记录</title><style>body{margin:0;background:#efd690;color:#563f2d;font-family:system-ui,"PingFang SC",sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 18px}h1{font-family:Georgia,"Songti SC",serif}.panel,.card{background:#fff8df;border:1.5px solid #806447;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 0 #c6a66a}.name{font-weight:800;font-size:18px}.time,.meta{opacity:.65;font-size:13px;margin-top:5px}.wish{margin-top:10px;padding-top:10px;border-top:1px dashed #b79a6f}.empty{opacity:.65}.btn{border:1px solid #76583d;border-radius:999px;background:#f4d98e;color:#493523;padding:10px 15px;font-weight:700}.btn.danger{background:#d97b65;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.cardTop{display:flex;justify-content:space-between;gap:12px}.deleteOne{border:1px solid #9a6a58;border-radius:999px;background:#fff1e8;color:#8b4a38;padding:6px 10px;font-size:12px}</style></head><body><div class="wrap"><h1>兑换记录</h1><div class="panel" id="loginPanel"><p>登录后查看兑换记录。</p><button class="btn" id="login">使用 Google 登录</button><div id="err" class="meta"></div></div><div class="panel hidden" id="userPanel"><b>已登录</b><div id="email" class="meta"></div><div class="row"><button class="btn" id="logout">退出登录</button><button class="btn danger" id="clearAll">清空全部记录并重置兑换券</button></div><div id="msg" class="meta"></div></div><div id="list" class="empty hidden">正在读取……</div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{initializeAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence,browserPopupRedirectResolver}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getDatabase,ref,onValue,remove,set}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";const cfg={apiKey:"AIzaSyBs9kQ_OhAIvrT7_zmDvEap9JMtGwq7nYY",authDomain:"reunion-coupons.firebaseapp.com",databaseURL:"https://reunion-coupons-default-rtdb.firebaseio.com",projectId:"reunion-coupons",storageBucket:"reunion-coupons.firebasestorage.app",messagingSenderId:"103744450895",appId:"1:103744450895:web:d48f9139ae6d7bb1c6953a"},OWNER='JkcnP68Fc6VGP3cNSYw1mMBjzii2';const app=initializeApp(cfg);const auth=initializeAuth(app,{persistence:[indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence],popupRedirectResolver:browserPopupRedirectResolver});const db=getDatabase(app),provider=new GoogleAuthProvider(),loginPanel=document.querySelector('#loginPanel'),userPanel=document.querySelector('#userPanel'),list=document.querySelector('#list'),msg=document.querySelector('#msg'),err=document.querySelector('#err');provider.setCustomParameters({prompt:'select_account'});let unsub=null,user=null;document.querySelector('#login').onclick=async()=>{err.textContent='';try{await signInWithPopup(auth,provider)}catch(e){console.error(e);err.textContent='登录失败：'+(e.code||e.message)}};document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('#clearAll').onclick=async()=>{if(!user||user.uid!==OWNER)return;if(!confirm('确定清空全部记录并立即重置所有设备上的兑换券吗？'))return;msg.textContent='正在重置……';try{await remove(ref(db,'redemptions'));await set(ref(db,'resetVersion'),Date.now());msg.textContent='已清空并发送全局重置信号。'}catch(e){msg.textContent='操作失败：'+e.message}};onAuthStateChanged(auth,u=>{if(unsub)unsub();user=u;if(!u){loginPanel.classList.remove('hidden');userPanel.classList.add('hidden');list.classList.add('hidden');return}loginPanel.classList.add('hidden');userPanel.classList.remove('hidden');document.querySelector('#email').textContent=u.email||'';list.classList.remove('hidden');if(u.uid!==OWNER){list.textContent='这个账号没有后台权限。';return}unsub=onValue(ref(db,'redemptions'),s=>{const d=s.val();if(!d){list.className='empty';list.textContent='还没有有效兑换。';return}const events=Object.entries(d).map(([id,x])=>({id,...x})).sort((a,b)=>(a.redeemedAt||a.clientTime||0)-(b.redeemedAt||b.clientTime||0));const latest=new Map();for(const e of events)latest.set(Number(e.couponIndex),e);const active=[...latest.values()].filter(e=>(e.type||'redeem')==='redeem').sort((a,b)=>(b.redeemedAt||b.clientTime||0)-(a.redeemedAt||a.clientTime||0));if(!active.length){list.className='empty';list.textContent='还没有有效兑换。';return}list.className='';list.innerHTML=active.map(x=>`<div class="card"><div class="cardTop"><div><div class="name">${esc(x.couponName||'兑换券')}</div><div class="time">${new Date(x.redeemedAt||x.clientTime).toLocaleString('zh-CN')}</div></div><button class="deleteOne" data-id="${x.id}">删除</button></div>${x.wish?`<div class="wish">愿望：${esc(x.wish)}</div>`:''}</div>`).join('');list.querySelectorAll('.deleteOne').forEach(b=>b.onclick=()=>confirm('删除这条有效兑换记录？')&&remove(ref(db,'redemptions/'+b.dataset.id)))})});function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
