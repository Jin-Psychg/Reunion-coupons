<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>见面兑换券</title>
<style>
:root{--paper:#f7e3a4;--ink:#563f2d;--red:#c75b48;--cream:#fff8df;--green:#657e65}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;background:#efd690;background-image:radial-gradient(#d9bb70 1px,transparent 1px);background-size:13px 13px}.wrap{max-width:480px;margin:auto;min-height:100vh;padding:18px 18px 50px}.hero{background:var(--cream);border:2px solid #795f42;border-radius:24px;overflow:hidden;box-shadow:0 7px 0 #b58e55;position:relative}.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.heroText{text-align:center;padding:16px 14px 20px}.hero h1{font-family:Georgia,serif;font-style:italic;font-size:31px;margin:0 0 5px}.hero p{margin:0;opacity:.75}.book{display:grid;gap:16px;margin-top:22px}.coupon{background:var(--cream);border:2px dashed #8b6948;border-radius:18px;padding:18px 18px 17px;position:relative;box-shadow:0 5px 0 #c6a66a;overflow:hidden}.coupon:before,.coupon:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#efd690;top:50%;transform:translateY(-50%)}.coupon:before{left:-11px}.coupon:after{right:-11px}.tag{font:700 11px/1 system-ui;letter-spacing:.16em;color:var(--red);text-transform:uppercase}.coupon h2{font-family:Georgia,"Songti SC",serif;font-size:24px;margin:7px 0}.coupon p{font-size:15px;margin:0 0 15px;line-height:1.55}.redeem{border:1.5px solid #76583d;border-radius:999px;background:#f4d98e;color:#493523;padding:9px 15px;font-weight:700;font-size:14px}.redeemed .redeem{display:none}.stamp{display:none;position:absolute;right:16px;bottom:16px;border:3px solid var(--red);color:var(--red);font:900 16px Georgia,serif;padding:6px 9px;transform:rotate(-9deg);border-radius:5px}.redeemed .stamp{display:block}.wish input{width:100%;border:0;border-bottom:1.5px solid #84664a;background:transparent;padding:8px 2px;margin:0 0 14px;font:16px inherit;color:var(--ink);outline:none}.music{position:fixed;right:17px;top:17px;z-index:9;width:43px;height:43px;border-radius:50%;border:1.5px solid #6f573e;background:#fff4cd;font-size:20px;box-shadow:0 3px 0 #b9955e}.note{text-align:center;font-size:12px;opacity:.6;margin-top:24px}.firework{position:fixed;pointer-events:none;font-size:30px;animation:pop 1.1s ease-out forwards}@keyframes pop{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:translateY(-70px) scale(1.8);opacity:0}}dialog{border:2px solid #73583d;border-radius:18px;background:#fff8df;color:var(--ink);max-width:330px;width:calc(100% - 40px);padding:22px;box-shadow:0 15px 50px #5d421f55}dialog::backdrop{background:#3b2b1a55}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}.actions button{border:1px solid #76583d;border-radius:999px;padding:8px 13px;background:#fff4cf}.actions .yes{background:#e8c66d;font-weight:700}
</style></head><body><button class="music" id="music" aria-label="音乐">♪</button><div class="wrap"><section class="hero"><img src="our-illustration.jpeg" alt="我们的插画"><div class="heroText"><h1>见面兑换券</h1><p>留到见面的时候用。</p></div></section><main class="book" id="book"></main><div class="note">每张券只能兑换一次 · 保存在这台设备上</div></div><dialog id="confirm"><b>现在兑换这张券？</b><div class="actions"><button onclick="confirmBox.close()">先留着</button><button class="yes" id="yes">兑换</button></div></dialog>
<script>
const coupons=[
['♨️','Spa Day','一起去放松一天'],['🍜','美食任选券','这一次，你想吃什么，我们就去吃什么'],['🎬','电影券','你选电影，我陪你看'],['💆','按摩券','兑换一次按摩'],['🛒','清空购物车券','选好想买的，我来买单'],['✨','愿望券','写一个你想和我一起做的事']];
const book=document.querySelector('#book'), confirmBox=document.querySelector('#confirm');let pending=null;
coupons.forEach((c,i)=>{let el=document.createElement('section');el.className='coupon '+(i===5?'wish ':'')+(localStorage['coupon'+i]?'redeemed':'');el.innerHTML=`<div class="tag">COUPON ${String(i+1).padStart(2,'0')}</div><h2>${c[0]} ${c[1]}</h2><p>${c[2]}</p>${i===5?`<input id="wish" placeholder="我想……" value="${localStorage.wish||''}" ${localStorage['coupon5']?'disabled':''}>`:''}<button class="redeem">兑换</button><div class="stamp">REDEEMED</div>`;el.querySelector('.redeem')?.addEventListener('click',()=>{if(i===5){let w=el.querySelector('input').value.trim();if(!w){el.querySelector('input').focus();return}localStorage.wish=w}pending={i,el};confirmBox.showModal()});book.appendChild(el)});
document.querySelector('#yes').onclick=()=>{if(!pending)return;localStorage['coupon'+pending.i]=Date.now();pending.el.classList.add('redeemed');pending.el.querySelector('input')?.setAttribute('disabled','');confirmBox.close();for(let n=0;n<9;n++)setTimeout(()=>{let f=document.createElement('div');f.className='firework';f.textContent=['🎆','✨','✦'][Math.floor(Math.random()*3)];f.style.left=(15+Math.random()*70)+'vw';f.style.top=(35+Math.random()*35)+'vh';document.body.appendChild(f);setTimeout(()=>f.remove(),1200)},n*80)};
// Soft self-generated music: no external file or tracking. Starts only after tapping ♪.
let ctx,playing=false,nodes=[];const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
function startMusic(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();playing=true;let t=ctx.currentTime;notes.forEach((f,k)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f/2;g.gain.setValueAtTime(0,t+k*.55);g.gain.linearRampToValueAtTime(.035,t+k*.55+.08);g.gain.exponentialRampToValueAtTime(.001,t+k*.55+.5);o.connect(g).connect(ctx.destination);o.start(t+k*.55);o.stop(t+k*.55+.55);nodes.push(o)});setTimeout(()=>playing&&startMusic(),notes.length*550)}
document.querySelector('#music').onclick=e=>{if(!playing){startMusic();e.currentTarget.textContent='Ⅱ'}else{playing=false;ctx?.close();ctx=null;e.currentTarget.textContent='♪'}};
</script></body></html>
